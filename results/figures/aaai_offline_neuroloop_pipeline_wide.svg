<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900"
     role="img" aria-label="Offline Neuro-Loop pipeline matching AAAI Figures-3 layout">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E8449"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E86C1"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { font: 700 30px Cambria, "Times New Roman", Times, serif; fill: #1C2833; }
      .lab { font: 600 15px Cambria, "Times New Roman", Times, serif; fill: #1C2833; }
      .sm { font: 400 13px Cambria, "Times New Roman", Times, serif; fill: #5D6D7E; }
      .tiny { font: 600 12px Cambria, "Times New Roman", Times, serif; }
      .math { font: italic 600 14px Cambria, "Times New Roman", Times, serif; }
      .h { font: 700 16px Cambria, "Times New Roman", Times, serif; }
    ]]></style>
  </defs>

  <rect width="2400" height="900" fill="#FFFFFF"/>
  <text x="1200" y="40" text-anchor="middle" class="title">Offline Neuro-Loop Pipeline</text>

  <!-- ===== LEFT: Collection (blue) ===== -->
  <!-- Passive / Active humans -->
  <circle cx="90" cy="130" r="28" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <path d="M72 128 C80 112, 100 112, 108 128" fill="none" stroke="#2E86C1" stroke-width="2"/>
  <text x="90" y="180" text-anchor="middle" class="tiny" fill="#2E86C1">Passive</text>

  <text x="140" y="135" text-anchor="middle" class="lab" fill="#2E86C1">or</text>

  <circle cx="200" cy="130" r="28" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <path d="M182 128 C190 112, 210 112, 218 128" fill="none" stroke="#2E86C1" stroke-width="2"/>
  <rect x="180" y="162" width="40" height="16" rx="4" fill="#EBF5FB" stroke="#2E86C1"/>
  <circle cx="190" cy="170" r="3" fill="#2E86C1"/>
  <circle cx="210" cy="170" r="3" fill="#2E86C1"/>
  <text x="200" y="198" text-anchor="middle" class="tiny" fill="#2E86C1">Active</text>

  <!-- Collection Environment -->
  <rect x="280" y="90" width="150" height="70" rx="8" fill="#FEF9E7" stroke="#F4D03F" stroke-width="1.5"/>
  <text x="355" y="120" text-anchor="middle" class="lab">Environment</text>
  <text x="355" y="142" text-anchor="middle" class="sm">map / task</text>

  <!-- Collection Agent with pi* -->
  <rect x="500" y="70" width="150" height="110" rx="10" fill="#D6EAF8" stroke="#2E86C1" stroke-width="1.8"/>
  <circle cx="575" cy="105" r="18" fill="#5DADE2" stroke="#2E86C1"/>
  <text x="575" y="110" text-anchor="middle" class="tiny" fill="#FFFFFF">R</text>
  <rect x="525" y="135" width="100" height="30" rx="5" fill="#FFFFFF" stroke="#2E86C1"/>
  <text x="575" y="155" text-anchor="middle" class="math" fill="#2E86C1">&#960;*</text>

  <line x1="430" y1="115" x2="498" y2="115" stroke="#2E86C1" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="460" y="105" text-anchor="middle" class="tiny" fill="#2E86C1">State, Reward</text>
  <path d="M525 165 C470 200, 450 160, 430 145" fill="none" stroke="#2E86C1" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="460" y="185" class="tiny" fill="#2E86C1">Action</text>

  <!-- gaze / play from humans -->
  <line x1="228" y1="120" x2="278" y2="115" stroke="#2E86C1" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#ab)"/>

  <!-- Data labels into Dataset -->
  <text x="575" y="220" text-anchor="middle" class="math" fill="#2E86C1">fNIRS Data: f_t</text>
  <text x="575" y="242" text-anchor="middle" class="math" fill="#2E86C1">MDP Tuples: tup_t</text>
  <line x1="575" y1="180" x2="575" y2="205" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="575" y1="250" x2="575" y2="280" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#ab)"/>

  <!-- Dataset -->
  <rect x="480" y="285" width="190" height="55" rx="8" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="575" y="320" text-anchor="middle" class="h" fill="#2E86C1">Dataset</text>

  <!-- Split down -->
  <line x1="575" y1="340" x2="575" y2="380" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="280" y1="380" x2="1100" y2="380" stroke="#AEB6BF" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="350" y1="380" x2="350" y2="410" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="950" y1="380" x2="950" y2="410" stroke="#1E8449" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- Decoder Train/Test -->
  <text x="350" y="430" text-anchor="middle" class="lab" fill="#2E86C1">Decoder Train/Test</text>

  <rect x="170" y="450" width="100" height="160" rx="6" fill="#FFFFFF" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="220" y="475" text-anchor="middle" class="tiny" fill="#2E86C1">EP_0</text>
  <text x="220" y="505" text-anchor="middle" class="sm">tup_0</text>
  <text x="220" y="525" text-anchor="middle" class="sm">tup_1</text>
  <text x="220" y="545" text-anchor="middle" class="sm">tup_2</text>
  <text x="220" y="565" text-anchor="middle" class="sm">...</text>
  <text x="220" y="585" text-anchor="middle" class="sm">tup_T</text>

  <rect x="290" y="450" width="100" height="160" rx="6" fill="#FFFFFF" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="340" y="475" text-anchor="middle" class="tiny" fill="#2E86C1">EP_1</text>
  <text x="340" y="505" text-anchor="middle" class="sm">tup_0</text>
  <text x="340" y="525" text-anchor="middle" class="sm">tup_1</text>
  <text x="340" y="545" text-anchor="middle" class="sm">tup_2</text>
  <text x="340" y="565" text-anchor="middle" class="sm">...</text>
  <text x="340" y="585" text-anchor="middle" class="sm">tup_T</text>

  <rect x="410" y="450" width="100" height="160" rx="6" fill="#FFFFFF" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="460" y="475" text-anchor="middle" class="tiny" fill="#2E86C1">EP_2</text>
  <text x="460" y="505" text-anchor="middle" class="sm">tup_0</text>
  <text x="460" y="525" text-anchor="middle" class="sm">tup_1</text>
  <text x="460" y="545" text-anchor="middle" class="sm">tup_2</text>
  <text x="460" y="565" text-anchor="middle" class="sm">...</text>
  <text x="460" y="585" text-anchor="middle" class="sm">tup_T</text>

  <!-- Train LDA (blue, fit) -->
  <line x1="350" y1="610" x2="350" y2="680" stroke="#2E86C1" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ab)"/>
  <text x="370" y="650" class="tiny" fill="#2E86C1">fit</text>
  <rect x="285" y="685" width="130" height="55" rx="8" fill="#D6EAF8" stroke="#2E86C1" stroke-width="2"/>
  <text x="350" y="718" text-anchor="middle" class="h" fill="#2E86C1">LDA</text>
  <text x="350" y="770" text-anchor="middle" class="sm">trained on early episodes only</text>

  <!-- ===== CENTER: RL Holdout (green) ===== -->
  <text x="950" y="430" text-anchor="middle" class="lab" fill="#1E8449">RL Holdout</text>

  <rect x="780" y="450" width="120" height="160" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.5"/>
  <text x="840" y="475" text-anchor="middle" class="tiny" fill="#1E8449">EP_3</text>
  <text x="840" y="510" text-anchor="middle" class="sm">tup_0</text>
  <text x="840" y="530" text-anchor="middle" class="sm">tup_1</text>
  <text x="840" y="550" text-anchor="middle" class="sm">...</text>
  <text x="840" y="570" text-anchor="middle" class="sm">tup_T</text>

  <rect x="930" y="450" width="140" height="160" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.5"/>
  <text x="1000" y="475" text-anchor="middle" class="tiny" fill="#1E8449">EP_x</text>
  <text x="1000" y="510" text-anchor="middle" class="sm">tup_0</text>
  <text x="1000" y="530" text-anchor="middle" class="sm">tup_1</text>
  <text x="1000" y="550" text-anchor="middle" class="sm">...</text>
  <text x="1000" y="570" text-anchor="middle" class="sm">tup_T</text>

  <text x="950" y="635" text-anchor="middle" class="sm">never used to train LDA</text>

  <!-- Holdout streams: a_t and f_t -->
  <!-- a_t up then right to Environment -->
  <path d="M1000 450 C1000 300, 1400 280, 1550 280" fill="none" stroke="#1E8449" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ag)"/>
  <text x="1200" y="270" class="math" fill="#1E8449">a_t</text>

  <!-- f_t down/right to trained LDA (green inference) -->
  <path d="M1000 610 C1000 700, 1200 720, 1320 720" fill="none" stroke="#1E8449" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ag)"/>
  <text x="1120" y="700" class="math" fill="#1E8449">f_t</text>

  <!-- Trained LDA inference (green) - same model -->
  <line x1="415" y1="712" x2="1320" y2="712" stroke="#2E86C1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="900" y="700" class="tiny" fill="#2E86C1">same trained LDA (inference)</text>

  <rect x="1325" y="690" width="120" height="50" rx="8" fill="#E8F8F5" stroke="#1E8449" stroke-width="2"/>
  <text x="1385" y="721" text-anchor="middle" class="h" fill="#1E8449">LDA</text>

  <line x1="1445" y1="715" x2="1520" y2="715" stroke="#1E8449" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ag)"/>
  <text x="1480" y="700" class="math" fill="#1E8449">y&#770;_t</text>

  <rect x="1525" y="690" width="140" height="50" rx="8" fill="#E8F8F5" stroke="#1E8449" stroke-width="2"/>
  <text x="1595" y="721" text-anchor="middle" class="h" fill="#1E8449">Algorithm 1</text>

  <line x1="1665" y1="715" x2="1750" y2="550" stroke="#1E8449" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ag)"/>
  <text x="1730" y="640" class="math" fill="#1E8449">n_t</text>

  <!-- ===== RIGHT: RL loop ===== -->
  <rect x="1550" y="90" width="170" height="80" rx="10" fill="#FEF9E7" stroke="#F4D03F" stroke-width="1.6"/>
  <text x="1635" y="125" text-anchor="middle" class="lab">Environment</text>
  <text x="1635" y="148" text-anchor="middle" class="sm">map / task</text>

  <rect x="1850" y="70" width="220" height="200" rx="12" fill="#D5F5E3" stroke="#1E8449" stroke-width="2"/>
  <text x="1960" y="100" text-anchor="middle" class="lab" fill="#1E8449">Agent</text>
  <circle cx="1960" cy="145" r="28" fill="#58D68D" stroke="#1E8449" stroke-width="2"/>
  <text x="1960" y="151" text-anchor="middle" class="lab" fill="#FFFFFF">R</text>
  <rect x="1890" y="200" width="140" height="45" rx="8" fill="#FFFFFF" stroke="#1E8449"/>
  <text x="1960" y="228" text-anchor="middle" class="lab" fill="#1E8449">Base Algorithm</text>

  <!-- n_t into base algorithm -->
  <line x1="1750" y1="540" x2="1890" y2="230" stroke="#1E8449" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ag)"/>

  <line x1="1720" y1="130" x2="1848" y2="130" stroke="#1E8449" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="1780" y="118" text-anchor="middle" class="tiny" fill="#1E8449">State, Reward</text>
  <path d="M1890 245 C1800 280, 1760 200, 1720 170" fill="none" stroke="#1E8449" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="1785" y="255" text-anchor="middle" class="tiny" fill="#1E8449">Action</text>

  <!-- Legend -->
  <rect x="2100" y="320" width="18" height="12" rx="2" fill="#D6EAF8" stroke="#2E86C1"/>
  <text x="2128" y="331" class="sm">train / preprocess</text>
  <rect x="2100" y="345" width="18" height="12" rx="2" fill="#D5F5E3" stroke="#1E8449"/>
  <text x="2128" y="356" class="sm">RL holdout loop</text>

  <text x="1200" y="860" text-anchor="middle" class="sm">Holdout f_t is classified by the trained LDA; holdout a_t / tuples drive the RL loop.</text>
</svg>
